openapi: 3.0.3

info:
  title: Car Rental API
  version: 1.0.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /cars:
    get:
      operationId: getCars
      responses:
        "200":
          description: Cars list
          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: "#/components/schemas/Car"

    post:
      operationId: createCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarRequest"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
  /cars/{id}:
    get:
      operationId: getCarById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found

    patch:
      operationId: updateCar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarRequest"
      responses:
        "200":
          description: Updated car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found

    delete:
      operationId: deleteCar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Car deleted
        "404":
          description: Car not found

  /colors:
    get:
      operationId: getColors
      responses:
        "200":
          description: Colors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Color"
    post:
      operationId: createColor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColorRequest"
      responses:
        "201":
          description: Color created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
  /colors/{id}:
    get:
      operationId: getColorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
        "404":
          description: Color not found
    patch:
      operationId: updateColor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColorRequest"
      responses:
        "200":
          description: Updated color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
        "404":
          description: Color not found

  /body_type:
    get:
      operationId: getBodyType
      responses:
        "200":
          description: BodyType list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BodyType"
    post:
      operationId: createBodyType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBodyTypeRequest"
      responses:
        "201":
          description: BodyType created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyType"
  /body_type/{id}:
    get:
      operationId: getBodyTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: BodyType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyType"
        "404":
          description: BodyType not found
    patch:
      operationId: updateBodyType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBodyTypeRequest"
      responses:
        "200":
          description: Updated BodyType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyType"
        "404":
          description: BodyType not found

  /drive_type:
    get:
      operationId: DriveType
      responses:
        "200":
          description: DriveType list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriveType"
    post:
      operationId: DriveType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriveTypeRequest"
      responses:
        "201":
          description: DriveType created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveType"
  /drive_type/{id}:
    get:
      operationId: getDriveTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DriveType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveType"
        "404":
          description: DriveType not found
    patch:
      operationId: updateDriveType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriveTypeRequest"
      responses:
        "200":
          description: Updated BodyType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveType"
        "404":
          description: DriveType not found

  /fuel_type:
    get:
      operationId: getFuelType
      responses:
        "200":
          description: FuelType list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuelType"
    post:
      operationId: createFuelType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFuelTypeRequest"
      responses:
        "201":
          description: FuelType created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelType"
  /fuel_type_type/{id}:
    get:
      operationId: getFuelTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: FuelType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelType"
        "404":
          description: FuelType not found
    patch:
      operationId: updateFuelType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFuelTypeRequest"
      responses:
        "200":
          description: Updated FuelType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelType"
        "404":
          description: FuelType not found

  /transmission_type:
    get:
      operationId: getTransmissionType
      responses:
        "200":
          description: TransmissionType list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransmissionType"
    post:
      operationId: createTransmissionType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransmissionTypeRequest"
      responses:
        "201":
          description: TransmissionType created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransmissionType"
  /transmission_type/{id}:
    get:
      operationId: getTransmissionTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: TransmissionType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransmissionType"
        "404":
          description: TransmissionType not found
    patch:
      operationId: updateTransmissionType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransmissionTypeRequest"
      responses:
        "200":
          description: Updated TransmissionType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyType"
        "404":
          description: TransmissionType not found

  /brands:
    get:
      operationId: getBrands
      responses:
        "200":
          description: Brands list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
  /brand/{id}:
    get:
      operationId: getBrandById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Brand not found
    patch:
      operationId: updateBrand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandRequest"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Brand not found

  /models:
    get:
      operationId: getModels
      parameters:
        - name: brandId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Model created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
  /models/{id}:
    get:
      operationId: getModelById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found
    patch:
      operationId: updateModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found

  /customers:
    get:
      operationId: getCustomers
      responses:
        "200":
          description: Customers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{id}:
    get:
      operationId: getCustomerById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found
    patch:
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found


components:
  schemas:

    HealthResponse:
      type: object
      required:
        - status
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.6
        database:
          type: string
          example: ok

      
    AuditableEntity:
      type: object
      required:
        - created_at
        - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NameReference:
      type: object
      description: |
        Resolution order:
        1. id
        2. name
        Examples:
        Existing name:
          {
            "id": "uuid"
          }
        Find or create by name:
          {
            "name": "New Name"
          }
        Clear brand in PATCH:
          {}
      properties:
        id:
          type: string
        name:
          type: string
    NameEntity:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    CreateNameEntityRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
    UpdateNameEntityRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          minLength: 2
          maxLength: 50
    
    CodeReference:
      type: object
      description: |
        Resolution order:
        1. id
        2. code
        Examples:
        Existing name:
          {
            "id": "uuid"
          }
        Find or create by name:
          {
            "code": "New Code"
          }
        Clear brand in PATCH:
          {}
      properties:
        id:
          type: string
        code:
          type: string
    CodeEntity:
      type: object
      required:
        - id
        - code
      properties:
        id:
          type: string
        code:
          type: string
    CreateCodeEntityRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 100
    UpdateCodeEntityRequest:
      type: object
      properties:
        code:
          type: string
          nullable: true
          minLength: 2
          maxLength: 100
        hex:
          type: string
          nullable: true
          minLength: 2
          maxLength: 100

#  MainItems 
    Car:
      allOf:
        - $ref: "#/components/schemas/NameEntity"
        - $ref: "#/components/schemas/AuditableEntity"
        - type: object
          properties:
            description:
              type: string
              nullable: true
              maxLength: 1000
            power_hp:
              type: string
              nullable: true
              maxLength: 10
            color:
              allOf:
                - $ref: "#/components/schemas/CarColor"
              nullable: true
            body_type:
              allOf:
                - $ref: "#/components/schemas/CodeReference"
              nullable: true
            brand:
              allOf:
                - $ref: "#/components/schemas/NameReference"
              nullable: true
            drive_type:
              allOf:
                - $ref: "#/components/schemas/CodeReference"
              nullable: true
            fuel_type:
              allOf:
                - $ref: "#/components/schemas/CodeReference"
              nullable: true
            model:
              allOf:
                - $ref: "#/components/schemas/Model"
              nullable: true
            transmission_type:
              allOf:
                - $ref: "#/components/schemas/CodeReference"
              nullable: true
    CreateCarRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        power_hp:
          type: string
          nullable: true
          maxLength: 10
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true
        body_type:
          allOf:
            - $ref:  "#/components/schemas/CodeReference"
          nullable: true
        color:
          allOf:
            - $ref:  "#/components/schemas/CarColor"
          nullable: true
        drive_type:
          allOf:
            - $ref:  "#/components/schemas/CodeReference"
          nullable: true
        fuel_type:
          allOf:
            - $ref:  "#/components/schemas/CodeReference"
          nullable: true
        model:
          allOf:
            - $ref: "#/components/schemas/CarModel"
          nullable: true
        transmission_type:
          allOf:
            - $ref:  "#/components/schemas/CodeReference"
          nullable: true
    UpdateCarRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        power_hp:
          type: string
          nullable: true
          maxLength: 10
        body_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeReference"
          description: |
            Color update rules:
            field omitted:
              color is not changed
            color: {}
              clears current color
            color.id:
              uses existing color
            color.code:
              finds existing color by code or creates new one
        brand:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NameReference"
          description: |
            Brand update rules:
            field omitted:
              brand is not changed
            brand: {}
              clears current brand
            brand.id:
              uses existing brand
            brand.name:
              finds existing brand by name or creates new one
        color:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CarColor"
        drive_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeReference"
        fuel_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeReference"
        model:
          $ref: "#/components/schemas/CarModel"
          nullable: true
        transmission_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeReference"
        
#  Dictionaries
    Brand:
      allOf:
        - $ref: "#/components/schemas/NameEntity"
    CreateBrandRequest:
      allOf:
          - $ref: "#/components/schemas/CreateNameEntityRequest"     
    UpdateBrandRequest:
      allOf:
          - $ref: "#/components/schemas/UpdateNameEntityRequest"     
    
    Model:
      allOf:
        - $ref: "#/components/schemas/NameEntity"
        - type: object
          properties:
            brand:
              allOf:
                - $ref: "#/components/schemas/NameReference"
              nullable: true
    CreateModelRequest:
      allOf:
        - $ref: "#/components/schemas/CreateNameEntityRequest"
        - type: object
          properties:
            brand:
              allOf:
                - $ref: "#/components/schemas/NameReference"
              nullable: true
    UpdateModelRequest:
      allOf:
        - $ref: "#/components/schemas/UpdateNameEntityRequest"
        - type: object
          properties:
            brand:
              allOf:
                - $ref: "#/components/schemas/NameReference"
              nullable: true
    CarModel:
      allOf:
        - $ref: "#/components/schemas/NameReference"
        - type: object
          description: |
            Model reference.
            Resolution order:
            1. id
            2. name
            Examples:
            Existing model:
              {
                "id": "uuid"
              }
            Find existing model or create new model:
              {
                "name": "X6"
              }
            Find existing model or create new model within brand:
              {
                "name": "Golf",
                "brand": {
                  "name": "Volkswagen"
                }
              }
            Clear model in PATCH:

              {}
          properties:
            brand:
              allOf:
                - $ref: "#/components/schemas/NameReference"
              nullable: true

 
    BodyType:
      allOf:
        - $ref: "#/components/schemas/CodeEntity"
    CreateBodyTypeRequest:
      allOf:
          - $ref: "#/components/schemas/CreateCodeEntityRequest"
    UpdateBodyTypeRequest:    
      allOf:
          - $ref: "#/components/schemas/UpdateCodeEntityRequest"     

    Color:
      allOf:
        - $ref: "#/components/schemas/CodeEntity"
        - type: object
          properties:
            hex:
              type: string
              nullable: true
    CreateColorRequest:
      allOf:
          - $ref: "#/components/schemas/CreateCodeEntityRequest"
          - type: object
            properties:
              hex:
                type: string
                nullable: true
    UpdateColorRequest:
      allOf:
        - $ref: "#/components/schemas/UpdateCodeEntityRequest"
        - type: object
          properties:
            hex:
              type: string
              nullable: true
    CarColor:
      allOf:
        - $ref: "#/components/schemas/CodeReference"
        - type: object
          properties:
            hex:
              type: string
              nullable: true
    
    DriveType:
      allOf:
        - $ref: "#/components/schemas/CodeEntity"
    CreateDriveTypeRequest:
      allOf:
          - $ref: "#/components/schemas/CreateCodeEntityRequest"
    UpdateDriveTypeRequest:    
      allOf:
          - $ref: "#/components/schemas/UpdateCodeEntityRequest"     

    FuelType:
      allOf:
        - $ref: "#/components/schemas/CodeEntity"
    CreateFuelTypeRequest:
      allOf:
          - $ref: "#/components/schemas/CreateCodeEntityRequest"
    UpdateFuelTypeRequest:    
      allOf:
          - $ref: "#/components/schemas/UpdateCodeEntityRequest"     

    TransmissionType:
      allOf:
        - $ref: "#/components/schemas/CodeEntity"
    CreateTransmissionTypeRequest:
      allOf:
          - $ref: "#/components/schemas/CreateCodeEntityRequest"
    UpdateTransmissionTypeRequest:    
      allOf:
          - $ref: "#/components/schemas/UpdateCodeEntityRequest"     

#  Customers 
    Customer:
      allOf:
        - $ref: "#/components/schemas/AuditableEntity"
        - type: object
          required:
            - id
            - first_name
          properties:
            id:
              type: string
            first_name:
              type: string
              maxLength: 100
            last_name:
              type: string
              nullable: true
              maxLength: 100
            phone:
              type: string
              nullable: true
              maxLength: 50
            email:
              type: string
              nullable: true
              maxLength: 100
    CreateCustomerRequest:
      type: object
      required:
        - first_name
      properties:
        first_name:
          type: string
          minLength: 3
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 50
        email:
          type: string
          nullable: true
          maxLength: 100
    UpdateCustomerRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        
    