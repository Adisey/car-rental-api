openapi: 3.0.3

info:
  title: Car Rental API
  version: 1.0.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /cars:
    get:
      operationId: getCars
      responses:
        "200":
          description: Cars list
          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: "#/components/schemas/Car"

    post:
      operationId: createCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarRequest"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
  /cars/{id}:
    get:
      operationId: getCarById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found

    patch:
      operationId: updateCar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarRequest"
      responses:
        "200":
          description: Updated car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found

    delete:
      operationId: deleteCar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Car deleted
        "404":
          description: Car not found

  /colors:
    get:
      operationId: getColors
      responses:
        "200":
          description: Colors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Color"
    post:
      operationId: createColor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColorRequest"
      responses:
        "201":
          description: Color created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
  /colors/{id}:
    get:
      operationId: getColorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
        "404":
          description: Color not found
    patch:
      operationId: updateColor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColorRequest"
      responses:
        "200":
          description: Updated color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
        "404":
          description: Color not found

  /brands:
    get:
      operationId: getBrands
      responses:
        "200":
          description: Brands list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
  /brand/{id}:
    get:
      operationId: getBrandById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Brand not found
    patch:
      operationId: updateBrand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandRequest"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Color not found

  /models:
    get:
      operationId: getModels
      parameters:
        - name: brandId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Model created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
  /models/{id}:
    get:
      operationId: getModelById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found
    patch:
      operationId: updateModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Model not found


components:
  schemas:

    HealthResponse:
      type: object
      required:
        - status
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.6
        database:
          type: string
          example: ok

    NameReference:
      type: object
      description: |
        Resolution order:
        1. id
        2. name
        Examples:
        Existing name:
          {
            "id": "uuid"
          }
        Find or create by name:
          {
            "name": "New Name"
          }
        Clear brand in PATCH:
          {}
      properties:
        id:
          type: string
        name:
          type: string
    CodeReference:
      type: object
      description: |
        Resolution order:
        1. id
        2. code
        Examples:
        Existing name:
          {
            "id": "uuid"
          }
        Find or create by name:
          {
            "code": "New Code"
          }
        Clear brand in PATCH:
          {}
      properties:
        id:
          type: string
        code:
          type: string

    Car:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        color:
          allOf:
            - $ref: "#/components/schemas/CodeReference"
          nullable: true
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true
        model:
          allOf:
            - $ref: "#/components/schemas/Model"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCarRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        color:
          allOf:
            - $ref:  "#/components/schemas/CodeReference"
          nullable: true
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true
        model:
          allOf:
            - $ref: "#/components/schemas/CarModel"
          nullable: true
    UpdateCarRequest:
      type: object

      properties:
        name:
          type: string
          nullable: true

        description:
          type: string
          nullable: true
        color:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeReference"
          description: |
            Color update rules:
            field omitted:
              color is not changed
            color: {}
              clears current color
            color.id:
              uses existing color
            color.code:
              finds existing color by code or creates new one
        brand:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NameReference"
          description: |
            Brand update rules:
            field omitted:
              brand is not changed
            brand: {}
              clears current brand
            brand.id:
              uses existing brand
            brand.name:
              finds existing brand by name or creates new one
        model:
          $ref: "#/components/schemas/CarModel"
          nullable: true
        
    Color:
      type: object
      required:
        - id
        - code
      properties:
        id:
          type: string
        code:
          type: string
    CreateColorRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 50
    UpdateColorRequest:
      type: object
      properties:
        code:
          type: string
          nullable: true
          minLength: 2
          maxLength: 50

    Brand:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 2
          maxLength: 100
    CreateBrandRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100      
    UpdateBrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          nullable: true
    
    Model:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 2
          maxLength: 100
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true
    CreateModelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true
    UpdateModelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          nullable: true
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true
    CarModel:
      type: object
      description: |
        Model reference.
        Resolution order:
        1. id
        2. name
        Examples:
        Existing name:
          {
            "id": "uuid"
          }
        Find or create by name:
          {
            "name": "X6"
          }
        Clear model in PATCH:
          {}
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          allOf:
            - $ref: "#/components/schemas/NameReference"
          nullable: true



